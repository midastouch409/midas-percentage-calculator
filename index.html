<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midas Percentage Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: 50px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🧮 Midas Calculator</h1>

<p class="subtitle">Calculate percentages quickly and easily.</p>

<label for="percentage">Percentage (%)</label>
<input type="number" id="percentage" placeholder="Example: 25">

<label for="number">Number</label>
<input type="number" id="number" placeholder="Example: 40000">

<button onclick="calculatePercentage()">Calculate</button>

<div id="result">Your answer will appear here.</div>

</div>

<script>
function calculatePercentage() {
    const percentage = parseFloat(document.getElementById("percentage").value);
    const number = parseFloat(document.getElementById("number").value);

    if (isNaN(percentage) || isNaN(number)) {
        document.getElementById("result").innerText =
            "Please enter both numbers.";
        return;
    }

    const answer = (percentage / 100) * number;

    document.getElementById("result").innerText =
        percentage + "% of " + number.toLocaleString() +
        " = " + answer.toLocaleString();
}
</script>

</body>
  </html>
